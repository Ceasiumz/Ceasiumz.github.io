name: Update Markdown index

on:
  push:
    branches: [master]
    paths:
      - '**.md'
      - 'md_menu.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run content:index
      - name: Commit regenerated indexes
        run: |
          if git diff --quiet -- markdown-index.json md_files.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markdown-index.json md_files.json
          git commit -m "chore: refresh Markdown index"
          git push
