name: Publish GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Build site and AlphaBridge
        env:
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
        run: |
          npm run content:index
          npm --prefix game/AlphaBridge ci
          npm --prefix game/AlphaBridge run build
      - name: Assemble Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/game/AlphaBridge/' ./ "$RUNNER_TEMP/pages/"
          mkdir -p "$RUNNER_TEMP/pages/game/AlphaBridge"
          cp -a game/AlphaBridge/dist/. "$RUNNER_TEMP/pages/game/AlphaBridge/"
          test -f "$RUNNER_TEMP/pages/game/AlphaBridge/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - uses: actions/deploy-pages@v4
        id: deployment
